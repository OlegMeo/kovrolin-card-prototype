              <h2>Описание</h2>
              <p>Ковролин коллекции Carpetex изготавливается из прочного полипропилена и укладывается на резиновую подложку — такая конструкция обеспечивает высокую устойчивость к механическим повреждениям и внешним воздействиям. Иглопробивной ворс не истирается и легко очищается, в том числе специализированными моющими средствами, а качественная основа отвечает за долговечность и износостойкость.</p>
              <p>Материал рассчитан на активную эксплуатацию и подойдёт для спортивных залов, офисов, бильярдных, торговых и других коммерческих помещений. Его структура надолго сохраняет аккуратный вид, а само покрытие смотрится стильно и делает помещение комфортнее без лишних хлопот.</p>

            <p>Качественная укладка — один из ключевых факторов, влияющих на внешний вид и срок службы любого коврового покрытия: от эксклюзивных ковров до практичных бюджетных решений. Профессиональный монтаж помогает сохранить эстетичный вид покрытия и значительно продлить срок его эксплуатации.</p>
            <p>Наши специалисты знают все тонкости укладки и учитывают особенности каждого материала, обеспечивая аккуратный и надёжный результат, который будет радовать вас долгие годы.</p>
            <p><strong>Обратите внимание:</strong> укладка выполняется на свободной от мебели площади. Перестановка мебели и уборка строительного мусора не входят в стоимость, но могут быть организованы за дополнительную плату.</p>

        <section id="questions" class="tab-panel service-layout questions-panel" role="tabpanel" hidden>
          <div class="service-content"><section class="service-section"><h2>Популярные вопросы и ответы</h2><div class="faq-list"><details class="faq-item" open><summary><span class="faq-icon" aria-hidden="true"><img class="faq-icon__minus" src="assets/faq-minus.svg" alt="" /><img class="faq-icon__plus" src="assets/faq-plus.svg" alt="" /></span>Как рассчитать, сколько ковролина нужно?</summary><p>Измерьте длину и ширину помещения, учитывая ниши и дверные проёмы. При выборе рулона важна его ширина: раскладка должна учитывать направление ворса и возможные стыки. Точный запас на подрезку и совмещение рисунка поможет определить замерщик.</p></details>
<details class="faq-item"><summary><span class="faq-icon" aria-hidden="true"><img class="faq-icon__minus" src="assets/faq-minus.svg" alt="" /><img class="faq-icon__plus" src="assets/faq-plus.svg" alt="" /></span>Какой ковролин выбрать для спальни и прихожей?</summary><p>Для спальни обычно выбирают мягкое покрытие с комфортным ворсом. Для прихожей удобнее плотный короткий ворс, который проще очищать. В обоих случаях учитывайте назначение покрытия и класс износостойкости, указанные производителем.</p></details>
<details class="faq-item"><summary><span class="faq-icon" aria-hidden="true"><img class="faq-icon__minus" src="assets/faq-minus.svg" alt="" /><img class="faq-icon__plus" src="assets/faq-plus.svg" alt="" /></span>Когда нужна обработка края оверлоком?</summary><p>Оверлок нужен, если края покрытия останутся открытыми — например, когда ковролин используют как отдельный ковёр или дорожку. Обработка помогает защитить срез от осыпания и придаёт ему аккуратный вид. Если край скрыт под плинтусом, способ отделки подбирают при укладке.</p></details>
<details class="faq-item"><summary><span class="faq-icon" aria-hidden="true"><img class="faq-icon__minus" src="assets/faq-minus.svg" alt="" /><img class="faq-icon__plus" src="assets/faq-plus.svg" alt="" /></span>Как ухаживать за ковролином?</summary><p>Регулярно очищайте покрытие пылесосом. Свежую жидкость промокайте чистой салфеткой, не растирая пятно. Способ влажной чистки и средство выбирайте по инструкции производителя; сначала проверьте средство на незаметном участке и избегайте избыточного намокания.</p></details>
<details class="faq-item"><summary><span class="faq-icon" aria-hidden="true"><img class="faq-icon__minus" src="assets/faq-minus.svg" alt="" /><img class="faq-icon__plus" src="assets/faq-plus.svg" alt="" /></span>Можно ли уложить ковролин самостоятельно?</summary><p>Небольшое помещение простой формы можно подготовить и застелить самостоятельно, соблюдая инструкцию к покрытию. Основание должно быть ровным, сухим и чистым. Если нужны сложная подрезка, стыковка полотен или укладка на лестнице, лучше обратиться к специалистам.</p></details></div><button class="service-cta question-order" type="button">Задать вопрос</button></section></div>

        <section id="overlock" class="tab-panel service-layout" role="tabpanel" hidden>
          <div class="service-content"><h2>Обработка ковролина оверлоком</h2><p>Оверлок — это обработка краёв ковролина полипропиленовыми нитями с помощью специального петлевого шва. Такая отделка предотвращает осыпание краёв, придаёт покрытию аккуратный, завершённый вид и продлевает срок его службы. Рекомендуем заказать оверлок сразу при покупке, чтобы получить полностью готовое к использованию покрытие без дополнительных хлопот.</p><ul class="check-list"><li>Доставим ковролин с обработанными краями, полностью готовый к использованию</li><li>Подберём нити для оверлока точно в тон ковролина из широкой палитры оттенков</li><li>Выполним обработку у вас дома или в нашей мастерской — вам не придётся никуда ехать</li></ul></div>
          <div class="service-art service-art--overlock"><img src="assets/service-overlock.png" alt="Обработка края ковролина оверлоком" /></div>
        </section>

        <section id="measure" class="tab-panel service-layout" role="tabpanel" hidden>
          <div class="service-content"><h2>Бесплатный выезд замерщика</h2><p>Профессиональный замер — важный этап перед покупкой и укладкой ковролина. Специалист учтёт особенности помещения, точно рассчитает необходимое количество материала и поможет избежать лишних расходов и ошибок при монтаже. Рекомендуем вызвать замерщика до оформления заказа, чтобы подобрать оптимальное решение и быть уверенными в результате.</p><ul class="check-list"><li>Наш специалист приедет к вам домой или в офис в течение 24 часов после заявки, выполнит точные замеры, рассчитает необходимое количество материала и итоговую стоимость</li><li>Привезём с собой образцы ковролина, чтобы вы могли оценить качество и мягкость ворса, подобрать подходящий цвет и увидеть, как покрытие будет смотреться в вашем интерьере</li></ul><button class="service-cta measure-order" type="button">Заказать замер</button></div>
